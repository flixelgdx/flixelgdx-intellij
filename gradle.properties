pluginGroup = org.flixelgdx.intellij
pluginName = FlixelGDX
pluginRepositoryUrl = https://github.com/flixelgdx/flixelgdx-intellij
pluginVersion = 1.0.0

# The oldest IDE build the plugin claims to support (253 is IntelliJ IDEA 2025.3).
pluginSinceBuild = 253

# The IDE the plugin is compiled and tested against.
platformType = IU
platformVersion = 2026.3

# Do not bundle the Kotlin standard library; the IDE already ships one.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx1g
