<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebGPU probe</title>
<style>
  body { font: 13px monospace; margin: 12px; background: #2b2b2b; color: #ddd; }
  .ok { color: #6a8; }
  .bad { color: #e66; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h3>WebGPU probe</h3>
<pre id="out">Running...</pre>
<script>
(async function () {
  const lines = [];
  const add = (cls, text) => lines.push('<span class="' + cls + '">' + text + '</span>');
  add('', 'userAgent: ' + navigator.userAgent);
  add('', 'location: ' + location.href);
  add(window.isSecureContext ? 'ok' : 'bad', 'isSecureContext: ' + window.isSecureContext);
  const hasGpu = !!navigator.gpu;
  add(hasGpu ? 'ok' : 'bad', '!!navigator.gpu: ' + hasGpu);
  if (hasGpu) {
    try {
      const adapter = await navigator.gpu.requestAdapter();
      add(adapter ? 'ok' : 'bad', 'requestAdapter(): ' + (adapter ? 'got an adapter' : 'null'));
      if (adapter) {
        const info = adapter.info || {};
        add('', 'adapter vendor=' + info.vendor + ' architecture=' + info.architecture +
          ' device=' + info.device + ' description=' + info.description);
        add('', 'features: ' + Array.from(adapter.features).join(', '));
        try {
          const device = await adapter.requestDevice();
          add('ok', 'requestDevice(): ok');
          device.destroy();
        } catch (e) {
          add('bad', 'requestDevice() failed: ' + e);
        }
      }
    } catch (e) {
      add('bad', 'requestAdapter() threw: ' + e);
    }
  }
  try {
    const gl = document.createElement('canvas').getContext('webgl2');
    add(gl ? 'ok' : 'bad', 'WebGL2: ' + (gl ? 'available' : 'unavailable'));
  } catch (e) {
    add('bad', 'WebGL2 threw: ' + e);
  }
  document.getElementById('out').innerHTML = lines.join('\n');
})();
</script>
</body>
</html>
